defaults:
- env/maniskill_pick_and_place_co_rl@env.train
- env/maniskill_pick_and_place_co_rl@env.eval
- model/pi0_5@actor.model
- training_backend/fsdp@actor.fsdp_config
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 2
runner:
  task_type: embodied
  logger:
    log_path: /data/wangyinghan/results/pi05_pnp_center_crop_40k_flow_noise_eval
    project_name: rlinf
    experiment_name: pi05_pnp_center_crop_40k_flow_noise_eval
    logger_backends:
    - tensorboard
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: 1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 5
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: embodied_dagger
  loss_agg_func: token-mean
  bootstrap_type: always
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
  dagger:
    init_beta: 0.0
    beta_schedule: constant
    beta_decay: 1.0
    only_save_expert: false
  replay_buffer:
    enable_cache: false
    cache_size: 1
    min_buffer_size: 1
    sample_window_size: 1
    auto_save: false
env:
  group_name: EnvGroup
  enable_offload: false
  train:
    total_num_envs: 16
    auto_reset: true
    ignore_terminations: false
    use_fixed_reset_state_ids: false
    max_episode_steps: 120
    max_steps_per_rollout_epoch: 120
  eval:
    total_num_envs: 8
    auto_reset: true
    ignore_terminations: false
    use_fixed_reset_state_ids: false
    max_episode_steps: 120
    max_steps_per_rollout_epoch: 120
    group_size: 1
    is_eval: true
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
      info_on_video: true
      include_extra_views: true
      record_rollout_interval: 1
rollout:
  group_name: RolloutGroup
  recompute_logprobs: false
  unnorm_key: pnp_center_crop_train_500_lerobot_v2
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /data/wangyinghan/pytorch_checkpoints/pi05_pnp_center_crop_500_40k
    precision: ${actor.model.precision}
  backend: huggingface
  collect_transitions: false
  collect_prev_infos: false
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 1
  seed: 0
  enable_offload: false
  model:
    model_path: /data/wangyinghan/pytorch_checkpoints/pi05_pnp_center_crop_500_40k
    model_type: openpi
    add_value_head: false
    num_action_chunks: 10
    action_dim: 7
    num_steps: 10
    openpi:
      config_name: pi05_pnp_center_crop_500_2k
      num_images_in_input: 2
      action_chunk: 10
      action_horizon: 10
      action_env_dim: 7
      num_steps: 10
      add_value_head: false
      value_after_vlm: false
      noise_method: flow_noise
      train_expert_only: true
      value_vlm_mode: mean_token
      detach_critic_input: null
      discrete_state_input: true
      noise_params:
      - 0.16
      - 0.12
      - 200
    policy_setup: panda_pnp
    precision: null
  optim:
    lr: 0.0
    value_lr: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    critic_warmup_steps: 0
    total_training_steps: 1
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
