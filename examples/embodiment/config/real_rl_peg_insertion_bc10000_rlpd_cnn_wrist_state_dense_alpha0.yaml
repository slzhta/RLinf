defaults:
  - env/realworld_peg_insertion_co_rl@env.train
  - env/realworld_peg_insertion_co_rl@env.eval
  - model/cnn_policy@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: gpu
      placement: 0
    env:
      node_group: real
      placement: 0
    rollout:
      node_group: gpu
      placement: 0
  node_groups:
    - label: real
      node_ranks: 0
      hardware:
        type: Franka
        configs:
          - robot_ip: 192.168.1.2
            node_rank: 0
    - label: gpu
      node_ranks: 1

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:RLINF_LOG_PATH,./results}
    project_name: rlinf
    experiment_name: real_rl_peg_insertion_bc10000_rlpd_cnn_wrist_state_dense_alpha0
    logger_backends: [tensorboard]
  max_epochs: 10000
  max_steps: 10000
  only_eval: false
  val_check_interval: -1
  save_interval: -1
  save_interval_online_steps: 1200
  checkpoint_replay_buffer: false
  weight_sync_interval: 4
  resume_dir: null
  ckpt_path: /home/ubuntu/shiliangzhi/co-training/pretrained-model/peg_sim500_bc_step10000_rlpd_q10.pt

algorithm:
  sim_real_rl_co_training: false
  group_size: 1
  rollout_epoch: 1
  eval_rollout_epoch: 1
  update_epoch: 8
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  agg_q: min
  actor_agg_q: mean
  backup_entropy: false
  critic_subsample_size: 2
  critic_actor_ratio: 4
  bootstrap_type: standard
  gamma: 0.99
  tau: 0.005
  target_update_freq: 1
  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    target_entropy: -3
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: true
    cache_size: 200
    sample_window_size: 200
    min_buffer_size: 2
    auto_save: false
  demo_buffer:
    enable_cache: true
    cache_size: 20
    sample_window_size: 20
    min_buffer_size: 20
    load_path: /home/ubuntu/shiliangzhi/co-training/datasets/peg_real20_rlpd_dense005_20260914
    auto_save: false
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

peg_task:
  dense_reward_type: position_gaussian
  dense_reward_scale: 0.005
  target_ee_pose: [0.6255128184, 0.098170464, -0.0024262427, 3.1035002035, -0.0100337488, -0.034846719]
  workspace_xy: 0.15
  workspace_above: 0.15
  workspace_below: 0.025
  rotation_limits: [0.01, 0.01, 0.5]

env:
  group_name: EnvGroup
  train:
    total_num_envs: 1
    num_workers: 1
    max_steps_per_rollout_epoch: 120
    max_episode_steps: 240
    ignore_terminations: false
    video_cfg:
      save_video: true
      info_on_video: true
      fps: 10
      record_rollout_interval: 1
      video_base_dir: runtime_env:RLINF_LOG_PATH/${runner.logger.experiment_name}/video/train/real
    override_cfg:
      max_num_steps: 240
      peg_config: ${peg_task}
      camera_serials: ["141722075170"]
  eval:
    total_num_envs: 1
    num_workers: 1
    video_cfg:
      save_video: false
    override_cfg: ${env.train.override_cfg}

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  sync_weight_nccl_max_ctas: 32
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_path: /home/ubuntu/shiliangzhi/co-training/pretrained-model
    precision: ${actor.model.precision}
    num_q_heads: 10
  enable_torch_compile: true
  enable_cuda_graph: false

actor:
  initial_checkpoint_exclude_keys: [actor_logstd]
  group_name: ActorGroup
  sync_weight_no_wait: false
  training_backend: fsdp
  micro_batch_size: 128
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  enable_drq: false
  model:
    model_path: /home/ubuntu/shiliangzhi/co-training/pretrained-model
    add_value_head: false
    add_q_head: true
    preserve_actor_parameterization: true
    num_q_heads: 10
    independent_std: true
    use_state: true
    state_dim: 6
    action_dim: 6
    num_action_chunks: 1
    image_num: 1
    initial_logstd: -1.0
    logstd_range: [-4.0, 1.0]
    binary_action_indices: []
    binary_action_temperature: 1.0
    action_std_scale: [1, 1, 1, 1, 1, 1]
    encoder_config:
      ckpt_name: resnet10_pretrained.pt
      dropout: 0.0
      freeze_backbone: false
  optim:
    lr: 5.0e-6
    lr_scheduler: torch_constant
    clip_grad: 10.0
  critic_optim:
    lr: 2.0e-5
    lr_scheduler: torch_constant
    clip_grad: 10.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
