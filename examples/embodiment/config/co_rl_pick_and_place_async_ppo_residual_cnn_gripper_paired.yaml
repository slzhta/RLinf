defaults:
- env/maniskill_pick_and_place_co_rl@env.train
- env/maniskill_pick_and_place_co_rl@env.eval
- env/realworld_pick_and_place@env.train.co_training_env_cfg
- env/realworld_pick_and_place@env.eval.co_training_env_cfg
- model/residual_policy@actor.model
- training_backend/fsdp@actor.fsdp_config
- model/pi0_5@base_model
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 3
  component_placement:
    actor:
      node_group: sim
      placement: 0
    env:
      node_group: real,sim
      placement: 0:0,2:1
    rollout:
      node_group: sim
      placement: 0-1
  node_groups:
  - label: real
    node_ranks: 0
    hardware:
      type: Franka
      configs:
      - robot_ip: 192.168.1.2
        node_rank: 0
  - label: sim
    node_ranks: 1-2
runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:RLINF_LOG_PATH,./results}
    project_name: rlinf
    experiment_name: co_rl_pick_and_place_async_ppo_residual_cnn_gripper_paired
    logger_backends:
    - tensorboard
  max_epochs: 3000
  max_steps: 3000
  only_eval: false
  val_check_interval: -1
  save_interval: 10
  resume_dir: null
  ckpt_path: null
algorithm:
  sim_real_rl_co_training: true
  co_training_rollout_routing_mode: paired
  co_training_domain_buffer:
    mode: latest
    channel_maxsize: 1
    sample_rollout_length: 20
    real_ratio_min: 0.1
    real_ratio_target: 0.25
    real_ratio_max: 0.5
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  staleness_threshold: 2
  behave_weight_threshold: 5
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  value_loss_coef: 0.25
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  bootstrap_type: none
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 1.0
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
env:
  group_name: EnvGroup
  sim_real_alignment:
    controller:
      target_ee_pose:
      - 0.54515648
      - 0.03448609
      - -0.01847301
      - 3.07488508
      - -0.01941186
      - -0.0446862
      reset_ee_pose:
      - 0.54515648
      - 0.03448609
      - 0.06902699
      - 3.07488508
      - -0.01941186
      - -0.0446862
      action_scale:
      - 0.01
      - 0.05
      - 1.0
      clip_x_range: 0.15
      clip_y_range: 0.15
      clip_z_range_high: 0.15
      clip_z_range_low: 0.025
      clip_rz_range: 0.5
      clip_rp_range: 0.01
      use_target_controller: true
      enable_safety_box: true
  train:
    total_num_envs: 4
    num_workers: 1
    co_training_env_cfg:
      total_num_envs: 1
      num_workers: 1
      override_cfg:
        camera_serials:
        - '141722075170'
        - '233622071355'
      include_states_in_obs: true
      state_keys: [arm_joint_position, tcp_pose, gripper_open_state]
    include_states_in_obs: true
    init_params:
      use_hand_camera: true
    auto_reset: true
  eval:
    total_num_envs: 4
    num_workers: 1
    auto_reset: true
    seed: 50000
    co_training_env_cfg:
      total_num_envs: 1
      num_workers: 1
      override_cfg:
        camera_serials:
        - '141722075170'
        - '233622071355'
      include_states_in_obs: true
      state_keys: [arm_joint_position, tcp_pose, gripper_open_state]
    include_states_in_obs: true
    init_params:
      use_hand_camera: true
rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  sync_weight_nccl_max_ctas: 32
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
    num_q_heads: 10
  enable_torch_compile: false
  enable_cuda_graph: false
  collect_transitions: false
  collect_prev_infos: true
  residual_base_inference: true
actor:
  group_name: ActorGroup
  training_backend: fsdp
  initial_checkpoint_exclude_keys: []
  micro_batch_size: 40
  global_batch_size: 480
  seed: 1234
  enable_offload: false
  model:
    model_path: ${checkpoints.encoder}
    add_value_head: true
    add_q_head: false
    use_state: true
    action_dim: 7
    num_action_chunks: 1
    image_num: 2
    initial_logstd: -0.5
    logstd_range:
    - -4.0
    - 0.0
    binary_action_indices: []
    binary_action_temperature: 1.0
    action_std_scale: []
    encoder_config:
      ckpt_name: resnet10_pretrained.pt
      dropout: 0.0
      freeze_backbone: false
    enabled: true
    precision: '32'
    base_horizon: 10
    state_dim: 14
    state_mean: []
    state_std: []
    residual_action_indices:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    residual_action_scale:
    - 0.4
    - 0.4
    - 0.4
    - 0.4
    - 0.4
    - 0.4
    - 0.0
    gripper_mode: cnn
    gripper_checkpoint: ${checkpoints.gripper}
    gripper:
      image_num: 2
      image_size: 96
      state_dim: 14
      hidden_dim: 128
  optim:
    lr: 2.0e-05
    value_lr: 0.0002
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    weight_decay: 1.0e-06
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    use_orig_params: true
    gradient_checkpointing: false
reward:
  use_reward_model: false
critic:
  use_critic_model: false
base_model:
  model_path: ${checkpoints.openpi}
  num_action_chunks: 10
  action_dim: 7
  num_steps: 10
  openpi_data:
    repo_id: pnp_lerobot_sim500_real250_success_20260905_v1
  openpi:
    config_name: pi05_pnp
    action_chunk: 10
    action_env_dim: 7
    num_steps: 10
    add_value_head: false
    action_horizon: 10
    discrete_state_input: false
checkpoints:
  openpi: ~/wangyinghan/models/pi05_pnp_sim500_real250_success_20260905_nostate_10k
  encoder: ???
  gripper: ???
