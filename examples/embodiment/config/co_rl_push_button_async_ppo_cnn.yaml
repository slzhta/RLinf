# Co-training config: ManiSkill push-button simulation + Franka push-button real-world.
defaults:
  - env/maniskill_push_button_co_rl@env.train
  - env/maniskill_push_button_co_rl@env.eval
  - env/realworld_button@env.train.co_training_env_cfg
  - env/realworld_button@env.eval.co_training_env_cfg
  - model/cnn_policy@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: "sim"
      placement: 0
    env:
      node_group: "real,sim"
      placement: 0-1
    rollout:
      node_group: "sim"
      placement: 0
  node_groups:
    - label: "sim"
      node_ranks: 0
    - label: "real"
      node_ranks: 1
      hardware:
        type: Franka
        configs:
          - robot_ip: ROBOT_IP
            node_rank: 1

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "co_rl_push_button_async_ppo_cnn"
    logger_backends: ["tensorboard"]

  max_epochs: 8000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

algorithm:
  sim_real_rl_co_training: True
  co_training_rollout_routing_mode: single
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  staleness_threshold: 2
  behave_weight_threshold: 5

  rollout_epoch: 10
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 2

  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 16
    num_workers: 1
    ignore_terminations: True
    override_cfg:
      is_dummy: False
      use_dense_reward: True
      reward_scale: 0.02
      max_num_steps: 50
    co_training_env_cfg:
      total_num_envs: 1
      num_workers: 1
      override_cfg: # TODO(liangzhi): I think this is not true...
        is_dummy: False
        use_dense_reward: True
        reward_scale: 0.02
        max_num_steps: 50
        target_ee_pose: TARGET_EE_POSE

  eval:
    total_num_envs: 8
    num_workers: 1
    co_training_env_cfg: # TODO(liangzhi): same, and override is wrong
      total_num_envs: 1
      num_workers: 1
      override_cfg:
        is_dummy: False
        use_dense_reward: True
        reward_scale: 0.02
        max_num_steps: 50
        target_ee_pose: TARGET_EE_POSE

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  sync_weight_nccl_max_ctas: 32

  model:
    model_path: "/path/to/model"
    precision: ${actor.model.precision}
    num_q_heads: 10

  enable_torch_compile: True
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 500
  global_batch_size: 500
  seed: 1234
  enable_offload: False

  model:
    model_path: "/path/to/model"
    add_value_head: True
    add_q_head: False
    use_state: False
    state_dim: 19
    action_dim: 6

  optim:
    lr: 5e-5
    value_lr: 2e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
