defaults:
  - env/maniskill_peg_insertion_co_rl@env.train
  - env/maniskill_peg_insertion_co_rl@env.eval
  - model/cnn_policy@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: "3"

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:RLINF_LOG_PATH,./results}
    project_name: rlinf
    experiment_name: sim_rl_peg_insertion_cnn_wrist_state_n32_ue2
    logger_backends: [tensorboard]
  max_epochs: 500
  max_steps: 500
  only_eval: false
  val_check_interval: -1
  save_interval: 50
  resume_dir: null
  ckpt_path: null

algorithm:
  sim_real_rl_co_training: false
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  staleness_threshold: 2
  behave_weight_threshold: 5
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 2
  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  value_loss_coef: 0.25
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  bootstrap_type: none
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

peg_task:
  target_ee_pose: [0.6277788863, 0.0981798968, -0.0021730941, 3.0965636880, 0.0118820494, -0.0119057291]
  workspace_xy: 0.15
  workspace_above: 0.15
  workspace_below: 0.025
  rotation_limits: [0.01, 0.01, 0.5]

env:
  group_name: EnvGroup
  train:
    total_num_envs: 32
    num_workers: 1
    init_params:
      peg_config: ${peg_task}
      sim_config:
        scene_config:
          contact_offset: 0.0001
          rest_offset: 0.0
    video_cfg:
      save_video: true
      info_on_video: false
      fps: 10
      record_rollout_interval: 10
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    total_num_envs: 8
    num_workers: 1
    auto_reset: false
    seed: 50000
    init_params:
      peg_config: ${peg_task}
      sim_config:
        scene_config:
          contact_offset: 0.0001
          rest_offset: 0.0
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  sync_weight_nccl_max_ctas: 32
  model:
    model_path: ../pretrained-model
    precision: ${actor.model.precision}
    num_q_heads: 10
  enable_torch_compile: true
  enable_cuda_graph: false

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 120
  global_batch_size: 240
  seed: 1234
  enable_offload: false
  model:
    model_path: ../pretrained-model
    add_value_head: true
    add_q_head: false
    use_state: true
    state_dim: 6
    action_dim: 6
    num_action_chunks: 1
    image_num: 1
    initial_logstd: -1.0
    logstd_range: [-4.0, 0.0]
    binary_action_indices: []
    binary_action_temperature: 1.0
    action_std_scale: [1, 1, 1, 1, 1, 1]
    encoder_config:
      ckpt_name: resnet10_pretrained.pt
      dropout: 0.0
      freeze_backbone: false
  optim:
    lr: 1.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-5
    weight_decay: 1.0e-6
    clip_grad: 1.0
    critic_warmup_steps: 5
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
