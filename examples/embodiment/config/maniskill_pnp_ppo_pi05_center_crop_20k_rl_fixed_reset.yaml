defaults:
- env/maniskill_pick_and_place_co_rl@env.train
- env/maniskill_pick_and_place_co_rl@env.eval
- model/pi0_5@actor.model
- training_backend/fsdp@actor.fsdp_config
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 2,3
runner:
  task_type: embodied
  logger:
    log_path: /data/wangyinghan/results/pi05_pnp_center_crop_20k_rl_fixed_reset_v1
    project_name: rlinf
    experiment_name: pi05_pnp_center_crop_20k_rl_fixed_reset_v1
    logger_backends:
    - tensorboard
  max_epochs: 200
  max_steps: -1
  only_eval: False
  val_check_interval: 10
  save_interval: 50
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 5
  eval_rollout_epoch: 2
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 2
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  bootstrap_type: always
  kl_beta: 0.03
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
env:
  group_name: EnvGroup
  enable_offload: False
  train:
    override_cfg:
      controller_alignment:
        enable_random_reset: false
    total_num_envs: 16
    auto_reset: True
    ignore_terminations: False
    use_fixed_reset_state_ids: False
    max_episode_steps: 120
    max_steps_per_rollout_epoch: 120
  eval:
    override_cfg:
      controller_alignment:
        enable_random_reset: false
    total_num_envs: 16
    auto_reset: True
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    max_episode_steps: 120
    max_steps_per_rollout_epoch: 120
    group_size: ${algorithm.group_size}
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: False
  unnorm_key: pnp_center_crop_train_500_lerobot_v2
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: /data/wangyinghan/pytorch_checkpoints/pi05_pnp_center_crop_500_20k
    precision: ${actor.model.precision}
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 40
  global_batch_size: 960
  seed: 0
  enable_offload: False
  model:
    model_path: /data/wangyinghan/pytorch_checkpoints/pi05_pnp_center_crop_500_20k
    model_type: openpi
    add_value_head: True
    num_action_chunks: 10
    action_dim: 7
    num_steps: 5
    openpi:
      config_name: pi05_pnp_center_crop_500_2k
      num_images_in_input: 2
      action_chunk: 10
      action_horizon: 10
      action_env_dim: 7
      num_steps: 5
      add_value_head: True
      value_after_vlm: True
      noise_method: flow_noise
      noise_logvar_range: [0.08, 0.16]
      noise_params:
      - 0.16
      - 0.12
      - 200
      joint_logprob: True
    policy_setup: panda_pnp
  optim:
    lr: 2.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: False
critic:
  use_critic_model: False
