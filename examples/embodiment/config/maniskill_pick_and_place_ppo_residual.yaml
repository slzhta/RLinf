defaults:
  - env/maniskill_pick_and_place_co_rl@env.train
  - env/maniskill_pick_and_place_co_rl@env.eval
  - model/residual_policy@actor.model
  - model/pi0_5@base_model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

# Frozen SFT base: reuse pi0_5 defaults and keep task-specific settings here.
base_model:
  model_path: /home/ubuntu/wangyinghan/wangyitao/pytorch_checkpoints/pi05_pnp_sim500_real250_success_20260905_state_10k
  num_action_chunks: 10
  action_dim: 7
  num_steps: 10
  openpi_data:
    repo_id: pnp_lerobot_sim500_real250_success_20260905_v1
  openpi:
    config_name: pi05_pnp
    # Override pi0_5's actor.model references: actor is the residual policy.
    action_chunk: 10
    action_env_dim: 7
    num_steps: 10
    add_value_head: false
    action_horizon: 10
    discrete_state_input: true

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # Pin the one-environment residual baseline to GPU 0.
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: maniskill_pick_and_place_ppo_residual
    logger_backends: [tensorboard]
  max_epochs: 1000
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 20
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 4
  group_size: 1
  rollout_epoch: 1
  eval_rollout_epoch: 1
  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.001
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: null
  target_kl: 0.03
  value_clip: 0.2
  value_loss_coef: 0.25
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 1.0
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
  length_params:
    max_new_token: 7
    max_length: 1024
    min_length: 1

env:
  group_name: EnvGroup
  enable_offload: false
  train:
    total_num_envs: 1
    auto_reset: true
    ignore_terminations: false
    include_states_in_obs: true
    max_episode_steps: 120
    max_steps_per_rollout_epoch: 120
    residual:
      base_model: ${base_model}
      base_horizon: ${actor.model.base_horizon}
      action_dim: ${actor.model.action_dim}
      action_scale: ${actor.model.residual_action_scale}
      use_state: ${actor.model.use_state}
  eval:
    total_num_envs: 1
    auto_reset: true
    ignore_terminations: false
    include_states_in_obs: true
    max_episode_steps: 120
    max_steps_per_rollout_epoch: 120
    residual:
      base_model: ${base_model}
      base_horizon: ${actor.model.base_horizon}
      action_dim: ${actor.model.action_dim}
      action_scale: ${actor.model.residual_action_scale}
      use_state: ${actor.model.use_state}
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: false
  collect_prev_infos: true
  enable_torch_compile: false
  enable_cuda_graph: false
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 20
  global_batch_size: 120
  seed: 1234
  enable_offload: false
  optim:
    lr: 3.0e-5
    value_lr: 2.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-5
    weight_decay: 1.0e-6
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false
critic:
  use_critic_model: false
