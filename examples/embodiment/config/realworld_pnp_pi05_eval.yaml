defaults:
  - env/realworld_pick_and_place@env.train
  - env/realworld_pick_and_place@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: train
      placement: 0
    rollout:
      node_group: train
      placement: 0
    env:
      node_group: franka
      placement: 0
  node_groups:
    - label: train
      node_ranks: 0
    - label: franka
      node_ranks: 1
      hardware:
        type: Franka
        configs:
          - robot_ip: 192.168.1.2
            node_rank: 1

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: pi05_realworld_pnp_eval
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: 1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  dagger:
    init_beta: 0.0
    beta_schedule: constant
    beta_decay: 1.0
    only_save_expert: false
  rollout_epoch: 1
  # Number of real-robot episodes. Override at launch, for example:
  # algorithm.eval_rollout_epoch=20
  eval_rollout_epoch: 1
  gamma: 0.99
  update_epoch: 1
  adv_type: gae
  loss_type: embodied_dagger
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: 7
    max_length: 1024
    min_length: 1
  replay_buffer:
    enable_cache: false
    cache_size: 1
    min_buffer_size: 1
    sample_window_size: 1
    auto_save: false

env:
  group_name: EnvGroup
  enable_offload: false
  train:
    total_num_envs: 1
    auto_reset: true
    ignore_terminations: false
    use_spacemouse: false
    use_gello: false
    max_steps_per_rollout_epoch: 120
    max_episode_steps: 120
    video_cfg:
      save_video: true
      info_on_video: true
      include_extra_views: true
      video_base_dir: ${runner.logger.log_path}/video/train
      record_rollout_interval: 1
    override_cfg:
      task_description: >-
        pick up the purple cube from the taped tray and place it in the plain tray
      camera_serials: ["233622071355", "141722075170"]
      step_frequency: 5.0
      max_num_steps: 120
  eval:
    total_num_envs: 1
    auto_reset: true
    ignore_terminations: false
    use_spacemouse: false
    use_gello: false
    max_steps_per_rollout_epoch: 120
    max_episode_steps: 120
    video_cfg:
      save_video: true
      info_on_video: true
      include_extra_views: true
      video_base_dir: ${runner.logger.log_path}/video/eval
      record_rollout_interval: 1
    override_cfg:
      task_description: >-
        pick up the purple cube from the taped tray and place it in the plain tray
      camera_serials: ["233622071355", "141722075170"]
      step_frequency: 5.0
      max_num_steps: 120

rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: false
  collect_prev_infos: false
  model:
    model_path: /home/ubuntu/wangyinghan/wangyitao/pytorch_checkpoints/pi05_pnp_4k
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 1
  seed: 0
  enable_offload: false
  model:
    model_path: ${rollout.model.model_path}
    precision: null
    num_action_chunks: 10
    action_dim: 7
    num_steps: 10
    add_value_head: false
    openpi:
      config_name: pi05_pnp
      num_images_in_input: 2
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      train_expert_only: true
      noise_method: flow_sde
      add_value_head: ${actor.model.add_value_head}
      value_after_vlm: false
      value_vlm_mode: mean_token
      detach_critic_input: null
      action_horizon: 10
      discrete_state_input: true
  optim:
    lr: 1.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 4.0
    warmup_style: cosine
    lr_warmup_steps: 20
    total_training_steps: 1
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false