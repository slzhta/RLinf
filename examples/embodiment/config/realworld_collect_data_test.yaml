# Note: This is a yaml file only for testing
# It should be delete when ready to submit a pull request
defaults:
  - env/realworld_co_training_base@env.eval
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env:
      node_group: franka
      placement: 0
  node_groups:
    - label: franka
      node_ranks: 0
      hardware:
        type: Franka
        configs:
          - robot_ip: 192.168.1.2
            node_rank: 0

runner:
  task_type: embodied
  logger:
    log_path: null
    project_name: rlinf
    experiment_name: "collect-data"
    logger_backends: ["tensorboard"] # wandb, swanlab
  num_data_episodes: 1
  record_task_description: False

env:
  group_name: "EnvGroup"
  eval:
    ignore_terminations: False
    auto_reset: False
    use_spacemouse: True
    max_episode_steps: 200000000
    no_gripper: False
    override_cfg:
      camera_serials: ["141722075170","233622072915", ]
      target_ee_pose: [ 0.68890358,  0.10072748, -0.04299118,  3.05971374, -0.08385753 ,-0.038867  ]
      success_hold_steps: 1  # define how many consecutive steps the robot must hold the position to succeed
      max_num_steps: 200000000

  data_collection:
    enabled: True
    save_dir: ${runner.logger.log_path}/collected_data
    export_format: "pickle"      # or "pickle"
    only_success: True
    robot_type: "panda"
    fps: 10