defaults:
  - env/realworld_pick_and_place@env.train
  - env/realworld_pick_and_place@env.eval
  - model/residual_policy@actor.model
  - model/pi0_5@base_model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: gpu
      placement: 0
    env:
      node_group: real
      placement: 0
    rollout:
      node_group: gpu
      placement: 0
  node_groups:
    - label: real
      node_ranks: 0
      hardware:
        type: Franka
        configs:
          - robot_ip: 192.168.1.2
            node_rank: 0
    - label: gpu
      node_ranks: 1

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: real_rl_pick_and_place_openpi_residual_shared_t1_t240_ue4
    logger_backends: [tensorboard]
  max_epochs: 500
  max_steps: 500
  only_eval: false
  val_check_interval: -1
  save_interval: 5
  resume_dir: null
  ckpt_path: null

algorithm:
  sim_real_rl_co_training: false
  staleness_threshold: 2
  behave_weight_threshold: 5
  normalize_advantages: true
  kl_penalty: kl
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 4
  group_size: 1
  rollout_epoch: 2
  eval_rollout_epoch: 1
  bootstrap_type: none
  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: null
  value_clip: 0.2
  value_loss_coef: 0.25
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 1.0
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
  length_params:
    max_new_token: 7
    max_length: 1024
    min_length: 1

env:
  group_name: EnvGroup
  enable_offload: false
  sim_real_alignment:
    controller:
      target_ee_pose: [0.54515648, 0.03448609, -0.01847301, 3.07488508, -0.01941186, -0.0446862]
      reset_ee_pose: [0.54515648, 0.03448609, 0.06902699, 3.07488508, -0.01941186, -0.0446862]
      action_scale: [0.01, 0.05, 1.0]
      clip_x_range: 0.15
      clip_y_range: 0.15
      clip_z_range_high: 0.15
      clip_z_range_low: 0.025
      clip_rz_range: 0.5
      clip_rp_range: 0.01
      use_target_controller: true
      enable_safety_box: true
  train:
    total_num_envs: 1
    num_workers: 1
    max_steps_per_rollout_epoch: 120
    max_episode_steps: 120
    include_states_in_obs: true
    state_keys: [arm_joint_position, tcp_pose, gripper_open_state]
    override_cfg:
      camera_serials: ["141722075170", "233622071355"]
    video_cfg:
      save_video: true
      info_on_video: true
      include_extra_views: true
      fps: 10
      record_rollout_interval: 1
      video_base_dir: runtime_env:RLINF_LOG_PATH/${runner.logger.experiment_name}/video/train/real
  eval:
    total_num_envs: 1
    num_workers: 1
    include_states_in_obs: true
    state_keys: [arm_joint_position, tcp_pose, gripper_open_state]
    override_cfg:
      camera_serials: ["141722075170", "233622071355"]
    video_cfg:
      save_video: false

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  sync_weight_nccl_max_ctas: 32
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
  collect_transitions: false
  collect_prev_infos: true
  residual_base_inference: true
  enable_torch_compile: false
  enable_cuda_graph: false

actor:
  group_name: ActorGroup
  training_backend: fsdp
  initial_checkpoint_exclude_keys: []
  micro_batch_size: 120
  global_batch_size: 240
  seed: 1234
  enable_offload: false
  model:
    model_path: ~/shiliangzhi/co-training/pretrained-model
    precision: "32"
    add_value_head: true
    add_q_head: false
    use_state: true
    state_dim: 14
    image_num: 2
    encoder_input_size: 128
    action_dim: 7
    num_action_chunks: 1
    initial_logstd: -0.5
    logstd_range: [-4.0, 0.0]
    action_std_scale: [1, 1, 1, 1, 1, 1, 1]
    binary_action_indices: []
    binary_action_temperature: 1.0
    encoder_config:
      ckpt_name: resnet10_pretrained.pt
      dropout: 0.0
      freeze_backbone: true
    enabled: true
    base_horizon: 10
    state_mean: []
    state_std: []
    residual_action_indices: [0, 1, 2, 3, 4, 5]
    residual_action_scale: [0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.0]
    gripper_mode: cnn
    gripper_architecture: shared
    gripper_share_features: true
    shared_feature_checkpoint: ~/shiliangzhi/co-training/pretrained-model/pnp_shared_gripper_full_bc_20260912/best_features.pt
    gripper_checkpoint: ~/shiliangzhi/co-training/pretrained-model/pnp_shared_gripper_full_bc_20260912/best_head.pt
    gripper: {}
  optim:
    lr: 2.0e-5
    value_lr: 2.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-5
    weight_decay: 1.0e-6
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

base_model:
  model_path: ~/wangyinghan/models/pi05_pnp_sim500_real250_success_20260905_nostate_10k
  num_action_chunks: 10
  action_dim: 7
  num_steps: 10
  openpi_data:
    repo_id: pnp_lerobot_sim500_real250_success_20260905_v1
  openpi:
    config_name: pi05_pnp
    action_chunk: 10
    action_env_dim: 7
    num_images_in_input: 2
    num_steps: 10
    add_value_head: false
    action_horizon: 10
    discrete_state_input: false

reward:
  use_reward_model: false
critic:
  use_critic_model: false
