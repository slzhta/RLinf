defaults:
  - env/maniskill_pick_and_place_co_rl@env.train
  - env/maniskill_pick_and_place_co_rl@env.eval
  - model/residual_policy@actor.model
  - model/pi0_5@base_model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

base_model:
  model_path: /data/wangyinghan/pytorch_checkpoints/pi05_pnp_sim500_real250_success_20260905_nostate_10k
  num_action_chunks: 10
  action_dim: 7
  num_steps: 10
  openpi_data:
    repo_id: pnp_lerobot_sim500_real250_success_20260905_v1
  openpi:
    config_name: pi05_pnp
    action_chunk: 10
    action_env_dim: 7
    num_steps: 10
    add_value_head: false
    action_horizon: 10
    discrete_state_input: false

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: "0"

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: pnp_residual_scalar_gripper_n32_ue4
    logger_backends: [tensorboard]
  max_epochs: 500
  max_steps: 500
  only_eval: false
  val_check_interval: -1
  save_interval: 50
  resume_dir: null
  ckpt_path: null

algorithm:
  sim_real_rl_co_training: false
  normalize_advantages: true
  kl_penalty: kl
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 4
  group_size: 1
  rollout_epoch: 1
  eval_rollout_epoch: 1
  bootstrap_type: none
  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: null
  value_clip: 0.2
  value_loss_coef: 0.25
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 1.0
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
  length_params:
    max_new_token: 7
    max_length: 1024
    min_length: 1

env:
  group_name: EnvGroup
  enable_offload: false
  sim_real_alignment:
    controller:
      action_scale: [0.01, 0.05, 1.0]
      use_target_controller: true
  train:
    num_workers: 1
    total_num_envs: 32
    include_states_in_obs: true
    init_params:
      use_hand_camera: true
    video_cfg:
      save_video: true
      record_rollout_interval: 1
      info_on_video: false
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    num_workers: 1
    total_num_envs: 32
    include_states_in_obs: true
    init_params:
      use_hand_camera: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: false
  collect_prev_infos: true
  residual_base_inference: true
  enable_torch_compile: false
  enable_cuda_graph: false
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 128
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  model:
    model_path: /home/shiliangzhi/work-space/co-training/pretrained-model
    precision: "32"
    use_state: true
    state_dim: 14
    image_num: 2
    residual_action_indices: [0, 1, 2, 3, 4, 5]
    residual_action_scale: [0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.0]
    initial_logstd: -0.5
    logstd_range: [-4.0, 0.0]
    gripper_mode: cnn
    gripper_architecture: independent
    gripper_checkpoint: /home/shiliangzhi/work-space/co-training/init-bc/gripper_scalar_sim500_real250_20260911/checkpoints/best.pt
    gripper_initial_logstd: -1.0
    gripper_logstd_range: [-4.0, 0.0]
    gripper:
      output_mode: scalar
      image_num: 2
      image_size: 96
      state_dim: 14
      hidden_dim: 128
    binary_action_indices: []
    encoder_config:
      ckpt_name: resnet10_pretrained.pt
      dropout: 0.0
  optim:
    lr: 2.0e-5
    value_lr: 2.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-5
    weight_decay: 1.0e-6
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
