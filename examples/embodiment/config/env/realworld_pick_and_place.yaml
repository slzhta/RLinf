env_type: realworld

total_num_envs: null

auto_reset: true
ignore_terminations: false
seed: 0
group_size: 1
use_fixed_reset_state_ids: false
max_steps_per_rollout_epoch: 120
max_episode_steps: 120

use_spacemouse: false
use_gello: false
no_gripper: false
use_relative_frame: false
keyboard_reward_wrapper: pnp_human

# Keep the same physical policy camera as the verified Push Button setup.
# wrist_1 / serial 141722075170: third-person camera and Push Button main view
# (the key is legacy). wrist_2 / serial 233622072915: wrist camera, exposed as
# extra_view_images. Verify the physical serial labels before the first run.
main_image_key: wrist_1
include_states_in_obs: true
state_keys:
  - arm_joint_position
  - tcp_pose
  - gripper_open_state

human_feedback_cfg:
  success_key: s
  failure_key: f
  abort_key: x
  ready_key: r
  wait_for_reset_ready: true
  reset_poll_interval: 0.05
  reset_ready_timeout: null

video_cfg:
  save_video: true
  info_on_video: true
  include_extra_views: true
  video_base_dir: ${runner.logger.log_path}/video/train
  record_rollout_interval: 1

init_params:
  id: FrankaPickAndPlaceEnv-v1

override_cfg:
  camera_serials: ["233622071355", "141722075170"]
  is_dummy: false
  enable_camera_player: true
  use_target_controller: true
  target_ee_pose: [0.54515648, 0.03448609, -0.01847301, 3.07488508, -0.01941186, -0.0446862]
  action_scale: [0.01, 0.05, 1.0]
  clip_x_range: 0.15
  clip_y_range: 0.15
  clip_z_range_high: 0.15
  clip_z_range_low: 0.025
  clip_rz_range: 0.5
  clip_rp_range: 0.01
  random_xy_range: 0.01
  random_rz_range: 0.34906585
  enable_random_reset: true
  enable_inner_safety_box: false
  joint_reset_qpos: [0.0, 0.39269908, 0.0, -1.96349541, 0.0, 2.35619449, 0.78539816]
  step_frequency: 10.0
  max_num_steps: 120
  use_dense_reward: false
  use_reward_model: false
  enable_gripper_penalty: false
  use_zero_one_gripper_action: false
  binary_gripper_threshold: 0.5
