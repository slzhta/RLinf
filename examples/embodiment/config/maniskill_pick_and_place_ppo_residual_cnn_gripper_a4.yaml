# Six-dimensional residual + epoch-9 BC gripper; base component defaults only.
defaults:
  - env/maniskill_pick_and_place_co_rl@env.train
  - env/maniskill_pick_and_place_co_rl@env.eval
  - model/residual_policy@actor.model
  - model/pi0_5@base_model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

base_model:
  model_path: /data/wangyinghan/pytorch_checkpoints/pi05_pnp_sim500_real250_success_20260905_nostate_10k
  num_action_chunks: 10
  action_dim: 7
  num_steps: 10
  openpi_data:
    repo_id: pnp_lerobot_sim500_real250_success_20260905_v1
  openpi:
    config_name: pi05_pnp
    action_chunk: 10
    action_env_dim: 7
    num_steps: 10
    add_value_head: false
    action_horizon: 10
    discrete_state_input: false

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0
    env,rollout: 0,1

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: residual_s04_cnn_gripper_bc_joint_ppo
    logger_backends: [tensorboard]
  max_epochs: 500
  max_steps: -1
  only_eval: false
  val_check_interval: 50
  save_interval: 50
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 4
  group_size: 1
  rollout_epoch: 1
  eval_rollout_epoch: 1
  bootstrap_type: none
  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: null
  value_clip: 0.2
  value_loss_coef: 0.25
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 1.0
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
  length_params:
    max_new_token: 7
    max_length: 1024
    min_length: 1

env:
  group_name: EnvGroup
  enable_offload: false
  sim_real_alignment:
    controller:
      action_scale: [0.01, 0.05, 1.0]
      use_target_controller: true
  train:
    total_num_envs: 32
    auto_reset: true
    ignore_terminations: false
    include_states_in_obs: true
    init_params:
      use_hand_camera: true
    max_episode_steps: 120
    max_steps_per_rollout_epoch: 120
    residual:
      base_model: ${base_model}
      base_horizon: ${actor.model.base_horizon}
      action_dim: ${actor.model.action_dim}
      action_scale: ${actor.model.residual_action_scale}
      use_state: ${actor.model.use_state}
      gripper_mode: cnn
    video_cfg:
      save_video: true
      record_rollout_interval: 1
      video_base_dir: ${runner.logger.log_path}/video/train
      info_on_video: false
  eval:
    total_num_envs: 64
    auto_reset: true
    ignore_terminations: false
    include_states_in_obs: true
    init_params:
      use_hand_camera: true
    max_episode_steps: 120
    max_steps_per_rollout_epoch: 120
    residual:
      base_model: ${base_model}
      base_horizon: ${actor.model.base_horizon}
      action_dim: ${actor.model.action_dim}
      action_scale: ${actor.model.residual_action_scale}
      use_state: ${actor.model.use_state}
      gripper_mode: cnn
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: false
  collect_prev_infos: true
  enable_torch_compile: false
  enable_cuda_graph: false
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  model:
    use_state: true
    state_dim: 14
    residual_action_indices: [0, 1, 2, 3, 4, 5]
    residual_action_scale: [0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.0]
    # Only the six arm residual dimensions use Gaussian exploration.
    initial_logstd: -0.5
    logstd_range: [-4.0, 0.0]
    model_path: /data/shiliangzhi/work-space/pretrained_model
    gripper_mode: cnn
    gripper_checkpoint: /data/shiliangzhi/work-space/wangyinghan/RLinf/logs/gripper_bc_sft_mixed_gpu01_20260910-191143/checkpoints/best.pt
    gripper:
      image_num: 2
      image_size: 96
      state_dim: 14
      hidden_dim: 128
    binary_action_indices: []
    # Same gripper sampling rule as the previous seven-axis CNN.
    binary_action_temperature: 1.0
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 128
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  optim:
    lr: 2.0e-05
    value_lr: 0.0002
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    weight_decay: 1.0e-06
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false

launch:
  env_vars:
    CUDA_VISIBLE_DEVICES: 0,1
    RAY_ADDRESS: 101.6.96.181:6411
    RLINF_NODE_RANK: '0'
    RLINF_COMM_NET_DEVICES: rlinf
    OMP_NUM_THREADS: '4'
    OPENBLAS_NUM_THREADS: '4'
    MKL_NUM_THREADS: '4'
    MUJOCO_GL: egl
    PYOPENGL_PLATFORM: egl
    ROBOT_PLATFORM: LIBERO
  unset_env_vars:
    - VK_DRIVER_FILES
    - VK_ICD_FILENAMES
    - VK_ADD_DRIVER_FILES
    - LD_LIBRARY_PATH
    - LD_PRELOAD
    - PYTHONHOME

